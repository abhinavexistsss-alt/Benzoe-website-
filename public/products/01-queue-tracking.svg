<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="Animated Benzoe walk-in queue management interface">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fafafa"/><stop offset=".55" stop-color="#ecebff"/><stop offset="1" stop-color="#f0f8e9"/></linearGradient>
    <linearGradient id="phone" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#252525"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#252525" flood-opacity="0.2"/></filter>
    <style>.txt{font-family:Inter,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.ring{transform-origin:320px 348px;animation:spin 10s linear infinite}.pulse{transform-origin:center;animation:pulse 2s ease-in-out infinite}.rise{animation:rise 3.6s ease-in-out infinite}.rise2{animation:rise 4.2s ease-in-out infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35;transform:scale(.9)}}@keyframes rise{50%{transform:translateY(-14px)}}</style>
  </defs>
  <rect width="640" height="760" fill="url(#bg)"/>
  <circle cx="112" cy="616" r="72" fill="#1710e6" opacity=".10" class="rise"/>
  <circle cx="530" cy="122" r="98" fill="#8dc651" opacity=".18" class="rise2"/>
  <g filter="url(#shadow)">
    <rect x="194" y="54" width="252" height="652" rx="42" fill="url(#phone)"/>
    <rect x="212" y="82" width="216" height="596" rx="30" fill="#fff"/>
    <rect x="286" y="96" width="68" height="9" rx="5" fill="#252525" opacity=".22"/>
    <text x="238" y="148" class="mono" font-size="12" font-weight="800" fill="#1710e6">BENZOE LIVE</text>
    <text x="238" y="180" class="txt" font-size="24" font-weight="800" fill="#252525">Walk-in queue</text>
    <text x="238" y="204" class="txt" font-size="13" fill="#666">CityCare Clinic · OPD</text>

    <g class="ring">
      <circle cx="320" cy="348" r="106" fill="none" stroke="#e3e3e3" stroke-width="18"/>
      <path d="M320 242a106 106 0 1 1-92 159" fill="none" stroke="#1710e6" stroke-width="18" stroke-linecap="round"/>
      <path d="M320 242a106 106 0 0 1 92 53" fill="none" stroke="#8dc651" stroke-width="18" stroke-linecap="round"/>
    </g>
    <circle cx="320" cy="348" r="75" fill="#fafafa" stroke="#e3e3e3"/>
    <text x="320" y="326" text-anchor="middle" class="mono" font-size="12" fill="#666">YOUR TOKEN</text>
    <text x="320" y="374" text-anchor="middle" class="txt" font-size="58" font-weight="900" fill="#1710e6">#7</text>
    <text x="320" y="402" text-anchor="middle" class="txt" font-size="14" fill="#666">22 min wait</text>

    <rect x="238" y="496" width="164" height="50" rx="18" fill="#252525"/>
    <text x="320" y="527" text-anchor="middle" class="txt" font-size="14" font-weight="800" fill="#fff">No app download</text>
    <rect x="238" y="566" width="164" height="44" rx="14" fill="#f0f8e9" stroke="#8dc651"/>
    <circle cx="262" cy="588" r="7" fill="#8dc651" class="pulse"/>
    <text x="282" y="593" class="txt" font-size="13" font-weight="700" fill="#252525">Next update live</text>
  </g>
  <g class="rise">
    <rect x="68" y="180" width="144" height="54" rx="18" fill="#fff" stroke="#e3e3e3"/>
    <text x="140" y="213" text-anchor="middle" class="txt" font-size="13" font-weight="800" fill="#252525">Patient checked in</text>
  </g>
  <g class="rise2">
    <rect x="430" y="516" width="152" height="58" rx="18" fill="#fdffa3"/>
    <text x="506" y="551" text-anchor="middle" class="txt" font-size="14" font-weight="900" fill="#252525">ETA changed</text>
  </g>
</svg>
