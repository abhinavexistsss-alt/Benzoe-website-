<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="Animated Benzoe clinic management dashboard">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffef7"/><stop offset="0.52" stop-color="#eef0ff"/><stop offset="1" stop-color="#eff8e6"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1710e6"/><stop offset="1" stop-color="#635bff"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#8dc651"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#252525" flood-opacity="0.16"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1710e6" stroke-opacity="0.08"/></pattern>
    <style>
      .txt{font-family:Inter,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.float{animation:float 5.5s ease-in-out infinite}.float2{animation:float 6.3s ease-in-out infinite reverse}.pulse{animation:pulse 2.2s ease-in-out infinite}.slide{animation:slide 4.8s ease-in-out infinite}.bar1{animation:bar 2.4s ease-in-out infinite}.bar2{animation:bar 2.4s ease-in-out infinite .2s}.bar3{animation:bar 2.4s ease-in-out infinite .4s}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{opacity:.38;transform:scale(.94)}}@keyframes slide{50%{transform:translateX(18px)}}@keyframes bar{50%{transform:scaleY(.62)}}
    </style>
  </defs>
  <rect width="640" height="760" rx="0" fill="url(#bg)"/>
  <rect width="640" height="760" fill="url(#grid)"/>
  <circle cx="98" cy="108" r="76" fill="#1710e6" opacity="0.09" class="float"/>
  <circle cx="546" cy="642" r="110" fill="#8dc651" opacity="0.16" class="float2"/>

  <g filter="url(#shadow)">
    <rect x="62" y="72" width="516" height="616" rx="28" fill="#ffffff" stroke="#e3e3e3"/>
    <rect x="62" y="72" width="516" height="70" rx="28" fill="#252525"/>
    <path d="M62 114h516v28H62z" fill="#252525"/>
    <circle cx="98" cy="108" r="7" fill="#ff80bf"/><circle cx="121" cy="108" r="7" fill="#fdffa3"/><circle cx="144" cy="108" r="7" fill="#8dc651"/>
    <text x="178" y="114" class="txt" font-size="18" font-weight="700" fill="#fff">Benzoe Clinic Dashboard</text>
    <text x="468" y="113" class="mono" font-size="12" fill="#8dc651">LIVE OPD</text>

    <rect x="92" y="172" width="142" height="94" rx="18" fill="#ecebff"/>
    <text x="114" y="202" class="mono" font-size="12" fill="#1710e6">IN QUEUE</text>
    <text x="114" y="242" class="txt" font-size="42" font-weight="800" fill="#1710e6">24</text>
    <circle cx="207" cy="216" r="13" fill="#1710e6" opacity=".14" class="pulse"/>
    <circle cx="207" cy="216" r="6" fill="#1710e6"/>

    <rect x="252" y="172" width="142" height="94" rx="18" fill="#f0f8e9"/>
    <text x="274" y="202" class="mono" font-size="12" fill="#527d28">AVG WAIT</text>
    <text x="274" y="242" class="txt" font-size="42" font-weight="800" fill="#6da13b">18m</text>

    <rect x="412" y="172" width="136" height="94" rx="18" fill="#fafafa" stroke="#e3e3e3"/>
    <text x="434" y="202" class="mono" font-size="12" fill="#666">UPI PAID</text>
    <text x="434" y="242" class="txt" font-size="42" font-weight="800" fill="#252525">₹8k</text>

    <rect x="92" y="298" width="280" height="250" rx="22" fill="#fafafa" stroke="#e3e3e3"/>
    <text x="116" y="334" class="txt" font-size="16" font-weight="700" fill="#252525">Walk-in queue</text>
    <g class="slide">
      <rect x="116" y="360" width="232" height="48" rx="14" fill="#252525"/>
      <text x="136" y="390" class="txt" font-size="14" font-weight="700" fill="#fff">#142 · Dr. Sharma · Now</text>
    </g>
    <rect x="116" y="424" width="232" height="48" rx="14" fill="#fff" stroke="#e3e3e3"/>
    <text x="136" y="454" class="txt" font-size="14" font-weight="700" fill="#252525">#143 · ETA 8 min</text>
    <rect x="116" y="488" width="232" height="48" rx="14" fill="#f0f8e9" stroke="#8dc651"/>
    <text x="136" y="518" class="txt" font-size="14" font-weight="700" fill="#252525">#144 · Checked in</text>

    <rect x="394" y="298" width="154" height="250" rx="22" fill="#1710e6"/>
    <text x="418" y="334" class="mono" font-size="12" fill="#fff" opacity=".72">PRESCRIPTION</text>
    <rect x="418" y="360" width="106" height="10" rx="5" fill="#fff" opacity=".88"/>
    <rect x="418" y="386" width="80" height="10" rx="5" fill="#fff" opacity=".52"/>
    <rect x="418" y="412" width="96" height="10" rx="5" fill="#fff" opacity=".52"/>
    <rect x="418" y="458" width="82" height="40" rx="20" fill="#8dc651"/>
    <text x="459" y="483" text-anchor="middle" class="txt" font-size="14" font-weight="800" fill="#252525">Save</text>

    <rect x="92" y="580" width="456" height="66" rx="20" fill="#fdffa3"/>
    <text x="118" y="620" class="txt" font-size="17" font-weight="800" fill="#252525">Queue + prescriptions + UPI billing + records</text>
  </g>
</svg>
